  keywords:   # case-insensitive regular expressions, evaluated against the finding title
    - ['sql injection|sqli\b', sql_injection]
    - ['cross[- ]site scripting|\bxss\b', xss]
    - ['directory traversal|path traversal|local file inclusion', path_traversal]
    - ['response splitting|header injection|crlf injection', header_injection]
    - ['default (password|credential|account|login)|anonymous ftp|blank password|no password', default_account]
    - ['backdoor|web ?shell|trojan|rootkit|malware', backdoor]
    - ['zone transfer|axfr', dns_zone_transfer]
    - ['\bsslv?[23]\b|ssl version 2|ssl version 3|tls version 1\.0|tlsv?1\.0 |early tls|tls 1\.0', ssl_early_tls]
    - ['tls version 1\.1|tls 1\.1', deprecated_tls]
    - ['unsupported (version|os|operating|web server|software|unix)|end[- ]of[- ]life|\beol\b|seol|no longer supported', unsupported_software]
    - ['anonymous cipher|\banull\b|adh cipher', anonymous_cipher]
    - ['rc4|3des|sweet32|export cipher|null cipher|weak cipher|medium strength cipher|low strength cipher', weak_cipher]
    - ['heartbleed|poodle|robot|logjam|freak|drown|ticketbleed|beast|lucky13|crime', tls_vulnerability]
    - ['certificate (cannot be trusted|is not trusted|signed using weak)|self[- ]signed|untrusted (root|ca|certificate)|wrong hostname|common name mismatch|mismatched (ssl )?certificate', cert_untrusted]
    - ['certificate (expiry|expired|has expired)|expired (ssl |tls )?certificate', cert_expired]
    - ['directory (browsing|listing|indexing)', directory_listing]
    - ['\btrace\b|\btrack\b method|webdav|insecure http method', insecure_http_methods]
    - ['(mysql|postgresql|microsoft sql server|mongodb|redis|memcached|elasticsearch|couchdb|oracle tns).*(detect|unauthenticated|open)', database_exposed]
    - ['denial of service|\bdos\b', dos_only]

# Findings that can be grouped (non-failing, rule-level) instead of listed per URL.
grouping:
  group_passing_web_findings: true
  # One finding per component and port for these categories, whichever engines reported them
  merge_across_engines: [cert_untrusted, cert_expired]
