name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `openasv doctor`
      render: text
  - type: input
    id: deploy
    attributes:
      label: Deployment (Docker Compose, pip, other) and profile used
  - type: textarea
    id: logs
    attributes:
      label: Relevant scan log lines (remove hostnames and confidential data)
      render: text
