name: Scoring policy or classification change
description: Propose a change to how findings are categorised or scored
labels: [policy]
body:
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Category, rule ID or special note affected, and the new behaviour.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting reference
      description: ASV Program Guide section, PCI DSS requirement, or vendor documentation.
    validations:
      required: true
